<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Shield Icon -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield Glow -->
    <path d="M22 2L4 9V22C4 33.5 11.7 44.2 22 47C32.3 44.2 40 33.5 40 22V9L22 2Z" fill="url(#shield-grad)" stroke="#00f0ff" stroke-width="2" stroke-linejoin="round"/>
    <!-- Inner Cyber Circuit Lines -->
    <path d="M22 10V22M14 18L22 22L30 18M16 29L22 34L28 29" stroke="#00ffb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Core Lock Node -->
    <circle cx="22" cy="22" r="3" fill="#00f0ff" filter="url(#glow)"/>
  </g>
  <!-- Text: SecureTech -->
  <text x="65" y="33" font-family="'Outfit', 'Inter', sans-serif" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Secure<tspan fill="#00f0ff">Tech</tspan></text>
  <!-- Tagline: CYBER SECURITY -->
  <text x="66" y="47" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#00ffb2" letter-spacing="3.5">CYBER SECURITY</text>

  <defs>
    <linearGradient id="shield-grad" x1="4" y1="2" x2="40" y2="47" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c2340" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#020d1a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="15" y="15" width="14" height="14" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
